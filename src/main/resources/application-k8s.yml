server:
  port: 8082

spring:
  application:
    name: vm-service
  main:
    allow-bean-definition-overriding: true

  datasource:
    url: jdbc:mysql://mysql-service.default.svc.cluster.local:3306/vmdb
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.MySQLDialect

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

apiVersion: v1
kind: Namespace
metadata:
  name: vm
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vm-service
  namespace: vm
  labels:
    app: vm-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vm-service
  template:
    metadata:
      labels:
        app: vm-service
    spec:
      serviceAccountName: vm-executor    # ← on utilise le SA qu’on a créé
      containers:
        - name: vm-service
          image: marammanai/vm-service:__IMAGE_TAG__
          imagePullPolicy: Always
          ports:
            - containerPort: 8082
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: k8s
            - name: EUREKA_URL
              value: http://discovery-service.discovery.svc.cluster.local:8761/eureka/
          # plus aucun volumeMount pour kubectl / kubeconfig
      # plus aucun volume pour kubectl-bin / kubeconfig
---
apiVersion: v1
kind: Service
metadata:
  name: vm-service
  namespace: vm
spec:
  type: NodePort
  selector:
    app: vm-service
  ports:
    - name: http
      port: 8082
      targetPort: 8082
      nodePort: 30092

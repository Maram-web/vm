apiVersion: v1
kind: Namespace
metadata:
  name: vm
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vm-service
  namespace: vm
  labels:
    app: vm-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vm-service
  template:
    metadata:
      labels:
        app: vm-service
    spec:
      serviceAccountName: vm-executor # ✅ AJOUT ICI
      containers:
        - name: vm-service
          image: marammanai/vm-service:__IMAGE_TAG__  # ✅ Remplace avec ta vraie version
          imagePullPolicy: Always
          ports:
            - containerPort: 8082
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: k8s
            - name: EUREKA_URL
              value: http://discovery-service.discovery.svc.cluster.local:8761/eureka/
          volumeMounts:
            - name: kubectl-bin
              mountPath: /usr/local/bin/kubectl
              subPath: kubectl
            - name: kubeconfig
              mountPath: /root/.kube  # nécessaire si ton kubectl utilise ce fichier
      volumes:
        - name: kubectl-bin
          hostPath:
            path: /usr/bin/kubectl  # 📍 Chemin du binaire kubectl sur ta VM
            type: File
        - name: kubeconfig
          hostPath:
            path: /opt/kubeconfig  # 📍 Crée ce dossier et copie ton ~/.kube/config dedans
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: vm-service
  namespace: vm
spec:
  type: NodePort
  selector:
    app: vm-service
  ports:
    - name: http
      port: 8082
      targetPort: 8082
      nodePort: 30092  # accès via http://<VM>:30092
